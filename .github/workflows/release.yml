# Release — build the image and publish it to GHCR.
#
# Separate from ci.yml on purpose. CI's `image` job proves the Dockerfile still
# builds and deliberately never pushes: a correctness gate should run on every
# branch and produce nothing. This runs only on a version tag and produces the
# artifact the README tells people to pull.
#
# It is also, since 10 August, the only place the image is built at all. The
# development machine ran out of disk doing it (see docs/DEPLOY-V1.md), so a
# runner is not a convenience here — it is the build.
#
#   git tag v1.0.0 && git push origin v1.0.0
#   docker run -p 8000:8000 ghcr.io/<owner>/helix:v1.0.0

name: Release

on:
  push:
    tags: ["v*"]
  # Buildable on demand, so a failed publish can be retried without inventing
  # a new version number.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  # GHCR authenticates with the automatic GITHUB_TOKEN; this is the scope that
  # lets it write. Without it the push fails at the very end of a long build.
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because GHCR rejects an uppercase path, and a GitHub owner
      # may legitimately have capitals in it — which fails only here, after the
      # build has already taken its ten minutes.
      - name: Work out the image name
        id: name
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both tags: the exact version is what a deployment pins, `latest` is
          # what the README's quickstart pulls.
          tags: |
            ${{ steps.name.outputs.repo }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.repo }}:latest
          # Shares the layer cache with ci.yml's `image` job, so the torch
          # install is not paid for twice.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker run -p 8000:8000 ${{ steps.name.outputs.repo }}:${{ steps.name.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
